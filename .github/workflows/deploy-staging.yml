name: Deploy Staging to GitHub Pages & Hetzner Server

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web for Staging
        run: flutter build web --release --base-href "/pambianconews/staging/" --dart-define=ENVIRONMENT=staging

      - name: Deploy Staging Preview to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          target-folder: staging
          branch: gh-pages

      - name: Auto-Provision & Setup Hetzner Staging Server
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Initializing Hetzner Server Environment..."
            mkdir -p /var/www/staging.pambianconews.com
            apt-get update && apt-get install -y curl git rsync ufw apache2-utils ca-certificates gnupg openssl
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              curl -fsSL https://get.docker.com | sh
            fi
            ufw allow 22/tcp || true
            ufw allow 80/tcp || true
            ufw allow 443/tcp || true
            ufw --force enable || true
            if [ ! -f /etc/nginx/.htpasswd ]; then
              mkdir -p /etc/nginx
              htpasswd -cb /etc/nginx/.htpasswd pambianco Staging2026!
              echo "Basic Auth created: pambianco / Staging2026!"
            fi
            echo "✅ Server setup complete!"

      - name: Deploy Code to Hetzner Staging Server via SSH
        uses: easingthemes/ssh-deploy@main
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "docker/ scripts/ wp-config-sample.php wp-content/"
          REMOTE_HOST: "[2a01:4f8:1c19:b282::1]"
          REMOTE_USER: ${{ secrets.STAGING_SSH_USER }}
          TARGET: ${{ secrets.STAGING_TARGET_DIR }}
          EXCLUDE: "/wp-content/uploads/, /.git/, /.github/"

      - name: Start Docker Containers on Hetzner with SSL
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            echo "🔐 Ensuring SSL Certificates for Cloudflare..."
            mkdir -p /var/www/staging.pambianconews.com/docker/ssl
            if [ ! -f /var/www/staging.pambianconews.com/docker/ssl/nginx.crt ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /var/www/staging.pambianconews.com/docker/ssl/nginx.key \
                -out /var/www/staging.pambianconews.com/docker/ssl/nginx.crt \
                -subj "/CN=staging.pambianconews.com"
            fi
            echo "🐳 Starting Docker Compose Services..."
            cd /var/www/staging.pambianconews.com/docker
            docker compose down || true
            docker compose up -d
            echo "--- NETSTAT ---"
            ss -tulpn || true
            echo "--- DOCKER PS ---"
            docker ps || true
            echo "✅ Staging Server Web Services Live on HTTP (80) & HTTPS (443)!"
