name: Deploy Staging to GitHub Pages

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web for Staging
        run: flutter build web --release --base-href "/pambianconews/staging/" --dart-define=ENVIRONMENT=staging

      - name: Deploy Staging to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          target-folder: staging
          branch: gh-pages
