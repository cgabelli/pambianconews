server {
    listen 80;
    listen 443 ssl default_server;
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    server_name staging.pambianconews.com *.staging.pambianconews.com localhost _;
    root /var/www/html;
    index index.php index.html;

    # Basic Auth / Security for Staging Environment
    auth_basic "Area riservata Staging Pambianconews";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security Headers & Prevent Indexing
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Media Fallback to Production (Senza scaricare Giga di Uploads su Staging)
    location ~^/wp-content/uploads/(.+) {
        try_files $uri @production_uploads;
    }

    location @production_uploads {
        auth_basic off;
        proxy_pass https://www.pambianconews.com;
        proxy_set_header Host www.pambianconews.com;
        proxy_ssl_server_name on;
        expires 7d;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
